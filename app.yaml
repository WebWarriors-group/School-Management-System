runtime: php83

env_variables:
  APP_ENV: production

  APP_DEBUG: "false"
  APP_STORAGE: "/tmp"
  VIEW_COMPILED_PATH: "/tmp"
  SESSION_DRIVER: cookie
  CACHE_DRIVER: files

handlers:

  - url: /build
    static_dir: public/build

  - url: /public/(.*)
    static_files: public/\1
    upload: public/.*\.(css|js|jpg|jpeg|gif|png|svg|woff2|ttf|ico|map)$


  - url: /.*
    script: auto