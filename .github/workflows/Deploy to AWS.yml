name: Deploy to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Git identity
        run: |
          git config --global user.name "piyjeem277"
          git config --global user.email "piyumanthajm@gmail.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, intl, mysql, gd
          coverage: none

      - name: Ensure missing PHP dependencies
        run: |
          composer require php-http/multipart-stream-builder --no-update
          composer clear-cache

      - name: Install PHP dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress || \
          composer update --no-interaction --prefer-dist --no-progress

      - name: Install JS dependencies
        run: |
          rm -f package-lock.json
          npm install

      - name: Build frontend
        run: npm run build

      - name: Setup SSH for deploy
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Ensure host key is known
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run remote deploy script on EC2
        run: |
          ssh -o StrictHostKeyChecking=yes -p ${ { secrets.EC2_SSH_PORT }:-22 } ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "bash -s" <<'EOF'
            # you can run the deploy script we created, or inline commands
            if [ -f /home/${{ secrets.EC2_USER }}/deploy.sh ]; then
              /home/${{ secrets.EC2_USER }}/deploy.sh
            else
              cd /var/www/smsdir
              git fetch --all
              git reset --hard origin/main
              composer install --no-dev --prefer-dist --optimize-autoloader -q
              npm ci --silent
              npm run build --silent
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache || true
              sudo chown -R www-data:www-data storage bootstrap/cache || true
              sudo chmod -R 775 storage bootstrap/cache || true
              sudo systemctl restart apache2 || sudo systemctl restart php8.2-fpm || true
            fi
          EOF
        env:
          DEPLOY_USER: ${{ secrets.EC2_USER }}
